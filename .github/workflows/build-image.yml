name: Build image

# Upstream publishes fnsys/dockhand from infrastructure outside this repository (ci.yml only
# runs unit tests, release.yml only creates the GitHub Release), so a fork has to build its own
# image. This pushes to ghcr.io/<owner>/dockhand using the workflow's GITHUB_TOKEN - no secrets
# to configure.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated target platforms'
        required: false
        default: 'linux/amd64'
  push:
    branches: ['main', 'feat/**']
    tags: ['v*']

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: ${{ github.event.inputs.platforms != '' && github.event.inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # The Dockerfile builds its own hardened OS layer with apko (Wolfi packages) and pins the
      # Node and Go base images by digest, so nothing here needs to be passed in.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-image
          cache-to: type=gha,mode=max,scope=build-image
